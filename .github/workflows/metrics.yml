name: Generate Terminal Metrics

on:
  schedule:
    # 1x por dia, 06:00 UTC (03:00 em Sao Paulo)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card do terminal (ja funcionando)
      - name: Terminal card
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.terminal.svg
          token: ${{ secrets.METRICS_TOKEN }}
          template: terminal
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_lines: yes
          plugin_lines_sections: base
          config_timezone: America/Sao_Paulo

      # Calendario de contribuicoes — substitui o activity graph da Vercel
      - name: Contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Sao_Paulo
